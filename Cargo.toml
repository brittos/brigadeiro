[package]
name = "brigadeiro"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Brigadeiro Player application for the COSMIC™ desktop"
repository = "https://github.com/brittos/brigadeiro"

[dependencies]
dirs = "6.0"
futures-util = "0.3.31"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.11.0"
tokio = { version = "1.48.0", features = ["full"] }
lofty = "0.23.2"
image = "0.25.9"
auto-palette = "0.9.2"
chrono = { version = "0.4", features = ["serde"] }
rodio = { version = "0.22", default-features = false, features = [
    "symphonia-all",
    "playback",
] }
rand = "0.9"
rusqlite = { version = "0.32.1", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
mpris-server = "0.9"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Accessibility support
    "a11y",
    # Advanced widget features (like .class())
    #"advanced",
    # About widget for the app
    "about",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Add Wayland support to winit
    "wayland",
    # GPU-accelerated rendering
    "wgpu",
    # Native file dialogs via XDG Portal (uses ashpd directly, not rfd)
    "xdg-portal",
]

# Using locally-cloned libcosmic to bypass ashpd dependency conflict
[patch.'https://github.com/pop-os/libcosmic']
#libcosmic = { path = "../libcosmic" }
#cosmic-config = { path = "../libcosmic/cosmic-config" }
#cosmic-theme = { path = "../libcosmic/cosmic-theme" }
